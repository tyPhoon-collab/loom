[package]
name = "loom"
version = "0.1.0"
edition = "2021"

[dependencies]
nom = "8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
colored = "3"
tabled = "0.20"
midir = "0.10"
ratatui = "0.30"
crossterm = "0.29"
notify = "8"
midly = "0.5"
phf = { version = "0.13", features = ["macros"] }

[dev-dependencies]
insta = { version = "1.46", features = ["yaml"] }
walkdir = "2"
