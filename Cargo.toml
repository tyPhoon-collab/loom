[package]
name = "loom"
version = "0.1.0"
edition = "2021"

[dependencies]
nom = "7.1.3"
clap = { version = "4.4.11", features = ["derive"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_yaml = "0.9.27"
anyhow = "1.0.75"
miette = { version = "5.10", features = ["fancy"] }
thiserror = "1.0"
colored = "2.0"
tabled = "0.15"
midir = "0.9"
ratatui = "0.30.0"
crossterm = "0.29.0"
notify = "8.2.0"
midly = { version = "0.5.3", features = ["std"] }
phf = { version = "0.13.1", features = ["macros"] }

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }
walkdir = "2.5.0"
